events { 
    worker_connections 1024; 
}

http {
    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # Обращаемся напрямую по именам контейнеров из docker-compose
        location /api/auth/ {
            set $auth_upstream auth-service:3001;
            rewrite ^/api/auth/(.*)$ /$1 break;
            proxy_pass http://$auth_upstream;
        }

        location /api/ticket/ {
            set $ticket_upstream ticket-service:3002;
            rewrite ^/api/ticket/(.*)$ /$1 break;
            proxy_pass http://$ticket_upstream;
        }

        location /api/booking/ {
            set $booking_upstream booking-service:3003;
            rewrite ^/api/booking/(.*)$ /$1 break;
            proxy_pass http://$booking_upstream;
        }

        location /api/payment/ {
            set $payment_upstream payment-service:3004;
            rewrite ^/api/payment/(.*)$ /$1 break;
            proxy_pass http://$payment_upstream;
        }
    }
}