services:


  ticket-services:
    build:
      context: ./services/ticket-services
    container_name: ticket-service
    env_file:
      - ./services/ticket-services/.env
    ports:
      - "3002:3002" # Порт авторизации
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
  

  auth-service:
    build:
      context: ./services/auth-services
    container_name: auth-service
    env_file:
      - ./services/auth-services/.env
    ports:
      - "3001:3001" # Порт авторизации
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: ./services/payment-services
    container_name: payment-service
    env_file:
      - ./services/payment-services/.env
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
 

  booking-service:
    build:
      context: ./services/booking-services # Путь до папки с Dockerfile
    container_name: booking-service
    env_file:
      - ./services/booking-services/.env # Подтягивает твои env переменные
    ports:
      - "3003:3003" # Заменить на порт, который слушает booking-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy



  postgres:
    container_name: ticket_postgres
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Shulgino523
      POSTGRES_DB: ticket_pro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ticket_pro"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    container_name: ticket_redis
    image: redis:7-alpine
    ports:
      - "6379:6379"


  nginx:
    image: nginx:latest
    container_name: ticket_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres
      - redis
      - kafka

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
    postgres_data:
    